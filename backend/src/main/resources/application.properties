spring.application.name=portfolio-api
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info

# Portfolio content. Override with e.g. file:/srv/portfolio.json to edit without rebuilding.
portfolio.content.location=${PORTFOLIO_CONTENT_LOCATION:classpath:data/portfolio.json}
# Contact form. Email is only sent when SMTP is configured, e.g. via env vars
# SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD;
# otherwise messages are logged.
portfolio.contact.recipient=${CONTACT_RECIPIENT:hassamarshad021@gmail.com}
portfolio.contact.sender=${CONTACT_SENDER:${spring.mail.username:no-reply@localhost}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Comma-separated front-end origins allowed to call the API; wildcards allowed (https://*.example.com).
portfolio.cors.allowed-origins=${PORTFOLIO_CORS_ORIGINS:http://localhost:4200}
